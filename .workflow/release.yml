version: '1.0'
name: 自动发布Release
displayName: 自动发布Release                    # ← 必填，显示在流水线列表的名称

triggers:
  push:
    tags:
      - 'v*'                                  # 只匹配以 v 开头的 Tag

stages:
  - name: 构建与发布
    displayName: 构建与发布阶段                # 阶段名称（非强制但建议）
    jobs:
      - name: create-release
        displayName: 创建Release任务           # 任务显示名（非强制）
        steps:
          - name: 拉取代码
            uses: checkout@1.0

          # （可选）在此插入你的构建步骤，例如：
          # - name: 编译打包
          #   run: |
          #     npm install
          #     npm run build
          #     zip -r dist.zip ./dist

          - name: 创建Gitee Release
            uses: gitrelease@1.0
            params:
              tag_name: ${{ gitee.ref_name }}
              release_name: 发布 ${{ gitee.ref_name }}
              body: |
                本次自动发布基于 Tag: ${{ gitee.ref_name }}
                请查看 Release 页面获取更新内容。
              # files:                         # 如需上传附件，取消注释
              #   - ./dist.zip
              #   - ./README.md
