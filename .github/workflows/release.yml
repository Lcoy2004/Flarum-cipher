name: Release

# 每次推送 v 开头的 tag（如 v1.0.1）时，自动创建 GitHub Release。
# Release 正文取 tag 的注释（annotated tag 消息），即提交时的发布说明。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 提取 annotated tag 的注释作为 Release Notes；
      # 若为 lightweight tag 则退化为使用最近一条提交信息。
      - name: Extract release notes from tag
        id: notes
        run: |
          BODY="$(git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents)' 2>/dev/null)"
          if [ -z "$BODY" ]; then
            BODY="$(git log -1 --format=%B)"
          fi
          {
            echo "notes<<EOF"
            printf '%s\n' "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
          draft: false
          prerelease: false
